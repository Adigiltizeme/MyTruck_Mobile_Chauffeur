# Mise à jour OTA automatique : chaque push sur master publie le code JS sur le canal "production".
# Si un fichier natif a changé (dépendances, app.json, plugins…), l'OTA est bloquée :
# les apps installées ne pourraient pas l'exécuter, il faut un nouveau build EAS.
name: EAS Update

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changements natifs ?
        id: native
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- \
            package.json package-lock.json app.json app.config.js eas.json \
            google-services.json GoogleService-Info.plist ios android || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::Fichiers natifs modifiés, OTA non publiée. Lancer un build : eas build --platform all --profile production"
            echo "$CHANGED"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.native.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: steps.native.outputs.skip == 'false'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        if: steps.native.outputs.skip == 'false'
        run: npm ci

      - name: Publier la mise à jour
        if: steps.native.outputs.skip == 'false'
        run: |
          eas update --channel production --environment production --non-interactive \
            --message "$(git log -1 --pretty=%s)"
